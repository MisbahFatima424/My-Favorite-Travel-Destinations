<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Travel Destinations</title>
</head>

<body>

    <header>
        <h1>My Favorite Travel Destinations</h1>
        <p>Some amazing places I would love to visit.</p>
    </header>

    <main>

        <section>
            <h2>Top Places</h2>

            <ul>
                <li>Switzerland</li>
                <li>Turkey</li>
                <li>Japan</li>
            </ul>

        </section>

        <section>
            <h2>Destination Gallery</h2>

            <figure>
                <img src="images/switzerland.jpg" alt="Beautiful mountains in Switzerland" width="400">
                <figcaption>Switzerland</figcaption>
            </figure>

            <figure>
                <img src="images/turkey.jpg" alt="Hot air balloons over Cappadocia in Turkey" width="400">
                <figcaption>Turkey</figcaption>
            </figure>

            <figure>
                <img src="images/japan.jpg" alt="Cherry blossoms in Japan" width="400">
                <figcaption>Japan</figcaption>
            </figure>
        </section>

        <section>
            <h2>Learn More</h2>

            <p>
                Visit the
                <a href="https://whc.unesco.org/" target="_blank" rel="noopener noreferrer">
                    UNESCO World Heritage Centre
                </a>
                to discover famous destinations around the world.
            </p>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 My HTML Final Project</p>
    </footer>

</body>

</html>
